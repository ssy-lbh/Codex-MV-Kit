[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mv-kit"
version = "0.1.0"
description = "Portable, agent-friendly tools for music-synchronized 2D sprite videos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Codex MV Kit contributors"}]
keywords = ["animation", "music-video", "sprites", "ffmpeg", "codex"]
dependencies = ["numpy>=1.24", "Pillow>=10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["build>=1"]

[project.scripts]
codex-mv = "codex_mv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
